<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="icon.ico" />
<title>timey.rip</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0c0c0c;
    --surface-2: #161616;
    --border: #2b2b2b;
    --mint: #ffffff;
    --mint-dim: #9a9a9a;
    --text-dim: #4a4a4a;
    --version-clr: #2a2a2a;
    --fs-heading: 13px;
    --fs-body: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--mint);
    font-family: "Courier New", Courier, monospace;
    min-height: 100vh;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 12px;
  }

  header .brand {
    font-weight: bold;
    font-size: var(--fs-heading);
    letter-spacing: 0.5px;
  }

  @keyframes cursor-blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .cursor {
    display: inline-block;
    margin-left: 1px;
    color: var(--mint-dim);
    animation: cursor-blink 0.9s steps(1) infinite;
  }

  header .version {
    font-size: var(--fs-body);
    color: var(--version-clr);
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 20px;
  }

  .hero {
    text-align: center;
    padding: 6px 0 26px;
  }

  .kaomoji {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    color: var(--text-dim);
    transition: color 0.2s ease;
    height: 20px;
    overflow: hidden;
    white-space: nowrap;
    cursor: default;
  }

  .kaomoji:hover {
    color: var(--mint);
  }

  .hero h1 {
    font-size: var(--fs-heading);
    font-weight: bold;
    margin: 14px 0 4px;
    letter-spacing: 0.5px;
  }

  .hero p {
    font-size: var(--fs-body);
    color: var(--text-dim);
    margin: 0;
  }

  .divider {
    border-top: 1px solid var(--border);
    margin: 0 0 20px;
  }

  .project {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 14px;
    transition: border-color 0.2s ease, background 0.2s ease,
                transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .project:hover {
    border-color: var(--mint-dim);
    background: var(--surface-2);
    transform: translateY(-6px);
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.6);
  }

  .projects.has-hover .project:not(:hover) {
    opacity: 0.45;
  }

  .project-name {
    display: block;
    font-size: var(--fs-heading);
    font-weight: bold;
    color: var(--mint);
    margin-bottom: 6px;
  }

  .project-desc {
    font-size: var(--fs-body);
    line-height: 1.6;
    color: var(--mint-dim);
    margin: 0 0 14px;
  }

  .project-bottom {
    display: flex;
    justify-content: flex-end;
  }

  @keyframes border-pulse {
    0%, 100% { border-color: var(--border); }
    50% { border-color: var(--mint); }
  }

  .pill {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    padding: 0 16px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-family: inherit;
    font-size: var(--fs-body);
    letter-spacing: 0.3px;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .pill:hover {
    color: var(--mint);
    animation: border-pulse 1.1s ease-in-out infinite;
  }

  .pill:active {
    background: var(--mint);
    color: #000000;
    border-color: var(--mint);
    animation: none;
  }

  footer {
    text-align: center;
    margin-top: 30px;
    font-size: var(--fs-body);
    color: var(--version-clr);
  }

  footer span {
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="wrap">

    <header>
      <span class="brand" id="brand"><span id="brand-text"></span><span class="cursor">_</span></span>
      <span class="version">&lt;3</span>
    </header>
    <hr />

    <div class="hero">
      <div class="kaomoji" id="kaomoji">(・ω・ )</div>
      <h1>projects</h1>
      <p>made by timey</p>
    </div>

    <div class="divider"></div>

    <div class="projects" id="projects">
    </div>

    <footer>dm me for questions or requests <span>♡</span><br> dc: 7imey</footer>
  </div>

<script>
  const projects = [
    {
      name: "skinpack builder",
      desc: "app which builds json files for mc bedrock skinpacks",
      href: "downloads/skinpack-builder.zip"
    },
    {
      name: "movement simulator",
      desc: "app which simulates in-game movement to prevent afk kicks",
      href: "downloads/movement-simulator.zip"
    },
    {
      name: "skin sorter",
      desc: "app which sorts and renames existing skinpack files",
      href: "downloads/skin-sorter.zip"
    }
  ];

  const container = document.getElementById("projects");

  projects.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "project";
    card.innerHTML = `
      <span class="project-name">${p.name}</span>
      <p class="project-desc">${p.desc}</p>
      <div class="project-bottom">
        <a class="pill" href="${p.href}" download>download</a>
      </div>
    `;
    container.appendChild(card);
  });

  container.addEventListener("mouseover", (e) => {
    if (e.target.closest(".project")) container.classList.add("has-hover");
  });
  container.addEventListener("mouseout", (e) => {
    if (!container.contains(e.relatedTarget)) container.classList.remove("has-hover");
  });

  const brandText = "timey.rip";
  const brandEl = document.getElementById("brand-text");
  let i = 0;

  function type() {
    if (i <= brandText.length) {
      brandEl.textContent = brandText.slice(0, i);
      i++;
      setTimeout(type, 70);
    }
  }
  type();

  const frames = ["(ノ^ω^)ノ", "~(^◡^ ~)", "ヽ(^o^ヽ )", "( ~^◡^)~"];
  const idle = "(・ω・ )";
  const el = document.getElementById("kaomoji");
  let frame = 0;
  let timer = null;

  function tick() {
    el.textContent = frames[frame % frames.length];
    frame++;
    timer = setTimeout(tick, 420);
  }

  el.addEventListener("mouseenter", () => { frame = 0; tick(); });
  el.addEventListener("mouseleave", () => {
    clearTimeout(timer);
    el.textContent = idle;
  });
</script>
</body>
</html>
